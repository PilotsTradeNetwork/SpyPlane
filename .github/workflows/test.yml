name: Test

on:
  pull_request:
    branches:
      - dev

env:
  IMAGE_NAME: spyplane

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          build-args: |
            VERSION=0.0.0+unknown
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Setup Test Data
        run: docker run -v "$(pwd)/db:/app/db:rw" -v "$(pwd)/tests/test_workspace:/app/tests/test_workspace:rw" -w /app --entrypoint /bin/bash ${{ env.IMAGE_NAME }}:${{ github.sha}} /app/db/test_recreate.sh

      - name: Test
        run: docker run -v "$(pwd)/tests:/app/tests:rw" -w /app ${{ env.IMAGE_NAME }}:${{ github.sha }} python -m unittest discover tests -v
