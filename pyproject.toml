[project]
name = "ptn-spyplane"
version = "0.1.0"
description = "PTN Spy Plane"
authors = [
    { name = "PTN Devs" },
]
dependencies = [
    "python-dotenv==0.21.1",
    "discord-py==2.6.3",
    "aiosqlite==0.21.0",
    "aiocron==1.8",
    "jq==1.10.0",
    "pytz==2022.7.1",
    "aiohttp==3.12.15",
    "discord-ext-prometheus==0.2.1",
    "httpx==0.28.1",
]

requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
]

[project.scripts]
spy = "ptn.spyplane.main:run"
lint = "ptn.spyplane.ruff_commands:lint"
format = "ptn.spyplane.ruff_commands:format_code"
lint-fix = "ptn.spyplane.ruff_commands:lint_fix"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ptn*"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".darcs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.10+
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't combine the checks from a single rule into a single
# violation. Instead, each check is treated as a separate violation.
select = [
    "E4",   # pycodestyle errors
    "E7",   # pycodestyle errors
    "E9",   # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

