[project]
name = "spyplane"
version = "0.1.0"
description = "PTN Spy Plane"
authors = [
    { name = "PTN Devs" },
]
dependencies = [
    "python-dotenv==0.21.1",
    "discord-py==2.6.3",
    "aiosqlite==0.21.0",
    "aiocron==1.8",
    "jq==1.10.0",
    "pytz==2022.7.1",
    "aiohttp==3.12.15",
    "discord-ext-prometheus==0.2.1",
    "httpx==0.28.1",
]
requires-python = ">=3.10"

[project.scripts]
spy = "spyplane.main:run"
test = "spyplane.test_runner:run_tests"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spyplane*"]

