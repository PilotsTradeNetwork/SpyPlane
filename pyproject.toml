[tool.poetry]
name = "spyplane"
version = "0.1.0"
description = "PTN Spy Plane"
authors = ["PTN Devs"]

[tool.poetry.scripts]
spy = "spyplane.main:run"

[tool.poetry.dependencies]
python = "~=3.10"
python-dotenv = "~=0.20"
discord-py = "~=2.2"
aiosqlite = "~=0.17"
gspread = "~=5.4"
aiocron = "~=1.8"
jq = "~=1.2"
pytz = "~=2022.1"
aiohttp = "~=3.12"
discord-ext-prometheus = "~=0.2"
httpx = "~=0.28"

[tool.poetry.dev-dependencies]
black = "~=24.3"

[tool.black]
line-length = 120
target-version = ['py310']

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
