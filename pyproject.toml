[project]
name = "spyplane"
version = "0.1.0"
description = "PTN Spy Plane"
authors = [
    { name = "PTN Devs" },
]
dependencies = [
    "python-dotenv~=1.2",
    "discord-py~=2.6",
    "aiosqlite~=0.21",
    "gspread~=5.12",
    "aiocron~=2.0",
    "jq~=1.10",
    "pytz>=2026.0",
    "aiohttp~=3.12",
    "discord-ext-prometheus~=0.2",
    "httpx~=0.28",
]
requires-python = ">=3.10"

[project.scripts]
spy = "spyplane.main:run"

